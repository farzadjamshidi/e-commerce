spring:
  application:
    name: order-service
  kafka:
    bootstrap-servers: localhost:19092,localhost:29092,localhost:39092
    producer:
      acks: all
      batch-size: 16384
      properties:
        "[enable.idempotence]": true
        "[max.in.flight.requests.per.connection]": 5
        "[linger.ms]": 5
        "[delivery.timeout.ms]": 120000
        "[request.timeout.ms]": 30000
