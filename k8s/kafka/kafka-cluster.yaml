# Three nodes, each both controller and broker, like the three kafka-* services in docker-compose.yml.
# The operator turns these two resources into pods, services, volumes and certificates.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: ecommerce
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 2Gi
        deleteClaim: true
        # KRaft metadata lives on this volume, next to the data
        kraftMetadata: shared
  # Small, so three brokers fit next to the rest on a laptop
  jvmOptions:
    -Xms: 384m
    -Xmx: 384m
  resources:
    requests:
      memory: 768Mi
    limits:
      memory: 768Mi
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: ecommerce
  namespace: kafka
spec:
  kafka:
    version: 4.2.2
    listeners:
      # Inside the cluster only; services reach it as ecommerce-kafka-bootstrap.kafka:9092
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      auto.create.topics.enable: false
  entityOperator:
    # Turns KafkaTopic resources into topics; no KafkaUser is used, so no user operator
    topicOperator: {}
