# The same three connectors as infra/debezium/*.json, owned by the operator instead of registered with curl.
# Only the database host differs: Postgres runs in the ecommerce namespace.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: order-outbox
  namespace: kafka
  labels:
    # The KafkaConnect cluster that runs it
    strimzi.io/cluster: debezium
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  config:
    database.hostname: "postgres.ecommerce.svc"
    database.port: "5432"
    database.user: "debezium"
    database.password: "debezium"
    database.dbname: "order_db"
    topic.prefix: "order-db"
    plugin.name: "pgoutput"
    publication.name: "outbox_publication"
    publication.autocreate.mode: "disabled"
    slot.name: "order_outbox_slot"
    table.include.list: "public.outbox_events,public.debezium_heartbeat"
    snapshot.mode: "no_data"
    tombstones.on.delete: "false"
    key.converter: "org.apache.kafka.connect.storage.StringConverter"
    value.converter: "org.apache.kafka.connect.storage.StringConverter"
    heartbeat.interval.ms: "10000"
    heartbeat.action.query: "UPDATE debezium_heartbeat SET ts = now() WHERE id = 1"
    transforms: "outbox"
    transforms.outbox.type: "io.debezium.transforms.outbox.EventRouter"
    transforms.outbox.predicate: "isOutbox"
    transforms.outbox.table.field.event.id: "id"
    transforms.outbox.table.field.event.key: "aggregate_id"
    transforms.outbox.table.field.event.payload: "payload"
    transforms.outbox.route.by.field: "destination"
    transforms.outbox.route.topic.replacement: "${routedByValue}"
    transforms.outbox.table.fields.additional.placement: "id:header:eventId,event_type:header:eventType,traceparent:header:traceparent"
    predicates: "isOutbox"
    predicates.isOutbox.type: "org.apache.kafka.connect.transforms.predicates.TopicNameMatches"
    predicates.isOutbox.pattern: "order-db\\.public\\.outbox_events"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: inventory-outbox
  namespace: kafka
  labels:
    strimzi.io/cluster: debezium
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  config:
    database.hostname: "postgres.ecommerce.svc"
    database.port: "5432"
    database.user: "debezium"
    database.password: "debezium"
    database.dbname: "inventory_db"
    topic.prefix: "inventory-db"
    plugin.name: "pgoutput"
    publication.name: "outbox_publication"
    publication.autocreate.mode: "disabled"
    slot.name: "inventory_outbox_slot"
    table.include.list: "public.outbox_events,public.debezium_heartbeat"
    snapshot.mode: "no_data"
    tombstones.on.delete: "false"
    key.converter: "org.apache.kafka.connect.storage.StringConverter"
    value.converter: "org.apache.kafka.connect.converters.ByteArrayConverter"
    heartbeat.interval.ms: "10000"
    heartbeat.action.query: "UPDATE debezium_heartbeat SET ts = now() WHERE id = 1"
    transforms: "dropOthers,outbox"
    transforms.dropOthers.type: "org.apache.kafka.connect.transforms.Filter"
    transforms.dropOthers.predicate: "isOutbox"
    transforms.dropOthers.negate: "true"
    transforms.outbox.type: "io.debezium.transforms.outbox.EventRouter"
    transforms.outbox.predicate: "isOutbox"
    transforms.outbox.table.field.event.id: "id"
    transforms.outbox.table.field.event.key: "aggregate_id"
    transforms.outbox.table.field.event.payload: "payload"
    transforms.outbox.route.by.field: "aggregate_type"
    transforms.outbox.route.topic.replacement: "inventory"
    transforms.outbox.table.fields.additional.placement: "id:header:eventId,event_type:header:eventType,traceparent:header:traceparent"
    predicates: "isOutbox"
    predicates.isOutbox.type: "org.apache.kafka.connect.transforms.predicates.TopicNameMatches"
    predicates.isOutbox.pattern: "inventory-db\\.public\\.outbox_events"
---
