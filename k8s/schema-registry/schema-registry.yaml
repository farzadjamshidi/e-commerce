# The schema-registry container of docker-compose.yml. It keeps every schema in the topic _schemas,
# which it creates itself, so it needs no volume and can be restarted anywhere.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: schema-registry
  template:
    metadata:
      labels:
        app: schema-registry
    spec:
      # Kubernetes would add SCHEMA_REGISTRY_PORT=tcp://... for the Service of the same name, and the image reads
      # every SCHEMA_REGISTRY_* variable as its own config, so it would fail at start
      enableServiceLinks: false
      containers:
        - name: schema-registry
          image: confluentinc/cp-schema-registry:8.0.0
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SCHEMA_REGISTRY_LISTENERS
              value: http://0.0.0.0:8081
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: ecommerce-kafka-bootstrap:9092
            # Same reason as in Compose: other services read these events and upgrade on their own schedule
            - name: SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL
              value: full_transitive
            - name: SCHEMA_REGISTRY_HEAP_OPTS
              value: -Xms256m -Xmx256m
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet:
              path: /subjects
              port: 8081
            periodSeconds: 5
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  namespace: kafka
spec:
  selector:
    app: schema-registry
  ports:
    - port: 8081
