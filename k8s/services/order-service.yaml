# Settings that differ from application.yml are environment variables; Spring Boot reads
# SPRING_DATASOURCE_URL as spring.datasource.url, and so on.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      enableServiceLinks: false
      containers:
        - name: order-service
          # Built from order-service/Dockerfile and loaded with kind load, see k8s/setup.sh
          image: ecommerce/order-service:0.1
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres.ecommerce.svc:5432/order_db
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: ecommerce-kafka-bootstrap.kafka.svc:9092
            - name: SCHEMAREGISTRY_URL
              value: http://schema-registry.kafka.svc:8081
            # No Jaeger in the cluster: no spans and no OTLP metrics are sent
            - name: MANAGEMENT_TRACING_EXPORT_ENABLED
              value: "false"
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
              value: "false"
          ports:
            - containerPort: 8081
          # Spring Boot exposes these groups when it runs on Kubernetes
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 5
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 512Mi
---
# NodePort 30081 is mapped to localhost:8081 by k8s/kind-config.yaml
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecommerce
spec:
  type: NodePort
  selector:
    app: order-service
  ports:
    - port: 8081
      nodePort: 30081
